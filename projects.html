    height: var(--header-height);

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const header = document.getElementById('makkari-auto-header');
    const mobileToggle = document.getElementById('mobile-toggle');
    const navMenu = document.getElementById('nav-menu');

    const handleScroll = () => {
      if (window.scrollY > 20) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    };

    window.addEventListener('scroll', handleScroll);
    handleScroll();

    const currentPath = window.location.pathname.toLowerCase();
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
      const hrefValue = link.getAttribute('href').toLowerCase();
      const isHome = (hrefValue === 'index.html' && (currentPath === '/' || currentPath.endsWith('index.html')));
      const isExactMatch = currentPath.includes(hrefValue.replace('.html', ''));

      if (isHome || (hrefValue !== 'index.html' && isExactMatch)) {
        link.classList.add('active-page');
        link.setAttribute('aria-current', 'page');
      }
    });

    if (mobileToggle && navMenu) {
      const toggleMenu = (forceClose = false) => {
        const isClosing = forceClose || navMenu.classList.contains('active');
        if (isClosing) {
          navMenu.classList.remove('active');
          mobileToggle.classList.remove('active');
          mobileToggle.setAttribute('aria-expanded', 'false');
        } else {
          navMenu.classList.add('active');
          mobileToggle.classList.add('active');
          mobileToggle.setAttribute('aria-expanded', 'true');
        }
      };

      mobileToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMenu();
      });

      document.addEventListener('click', (e) => {
        if (!header.contains(e.target)) {
          toggleMenu(true);
        }
      });
    }
  });
</script>
